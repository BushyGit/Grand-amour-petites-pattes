                speaker: "P'tit Gars",
                text: "Je ne sais pas si ce que j'ai dit avant était juste.\n\nMais je sais que tu as joué.\n\nEt que tu es allé jusqu'au bout.",
                bg: "url('bg_couloir.jpg')", emotion: "neutre", next: "p6_07"
            },
            p6_07: {
                speaker: "P'tit Gars",
                text: "Alors... merci.\n\nC'est tout ce que j'avais à dire.",
                bg: "url('bg_couloir.jpg')", emotion: "neutre", next: "p6_08"
            },
            p6_08: {
                speaker: "Jean-Eudes",
                text: "Moi aussi.\n\nMerci.\n\nEt désolé pour tout.",
                bg: "url('bg_couloir.jpg')", emotion: "neutre", next: "p6_fin"
            },
            p6_fin: {
                speaker: "P'tit Gars",
                text: "Squeak.",
                bg: "url('bg_couloir.jpg')", emotion: "neutre",
                phase6end: true, next: null
            },
        };

        // ==========================================
        // MOTEUR DE JEU (GESTION DES CLICS ET DE L'AFFICHAGE)
        // ==========================================

        dialogueBox.addEventListener('click', (e) => {
            // Anti-spam
            const now = Date.now();
            if (now - lastClickTime < COOLDOWN_MS) return;
            lastClickTime = now;

            if (isTyping) {
                // Si le dialogue est marqué noSkip, on ne peut pas sauter le texte
                if (currentNode && currentNode.noSkip) return;
                // SKIP : Terminer le texte instantanément
                playSound('clic.ogg');
                clearInterval(typingInterval);
                storyTextElement.textContent = currentFullText;
                isTyping = false;
                onTextFinished();
            } else {
                // NEXT : Passer à la scène suivante si c'est linéaire
                if (currentNode && currentNode.next) {
                    playSound('clic.ogg');
                    renderScene(currentNode.next);
                }
            }
        });

        function typeWriterEffect(text) {
            clearInterval(typingInterval);
            storyTextElement.textContent = '';
            choicesAreaElement.style.opacity = '0';
            choicesAreaElement.style.pointerEvents = 'none';
            nextIndicator.style.display = 'none';
            
            isTyping = true;
            currentFullText = text;

            let i = 0;
            // Les scènes glitch/scary tapent plus lentement pour l'effet horrifique
            const speed = (currentNode && currentNode.glitch) ? 60 : (currentNode && currentNode.scary) ? 45 : 30;

            typingInterval = setInterval(() => {
                storyTextElement.textContent += text.charAt(i);
                i++;
                if (i >= text.length) {
                    clearInterval(typingInterval);
                    isTyping = false;
                    onTextFinished();
                }
            }, speed);
        }

        function onTextFinished() {
            if (currentNode.action && !currentNode.actionExecuted) {
                currentNode.action();
                currentNode.actionExecuted = true;
            }

            if (currentNode.choices) {
                choicesAreaElement.style.opacity = '1';
                choicesAreaElement.style.pointerEvents = 'auto';
            } else if (currentNode.next) {
                nextIndicator.style.display = 'block';
                // Auto-avance si demandé (ex: ecran_titre_glitch)
                if (currentNode.autoAdvance) {
                    setTimeout(() => {
                        if (currentNode && currentNode.next) renderScene(currentNode.next);
                    }, currentNode.autoAdvance);
                }
            }
        }

        // Murmure en fond (toit)
        const whisperAudio = new Audio();
        whisperAudio.loop = true;
        whisperAudio.volume = 0;
        let whisperActive = false;
        function startWhisper() {
            if (whisperActive) return;
            whisperActive = true;
            whisperAudio.src = 'neutre_hamster.mp3';
            whisperAudio.playbackRate = 0.4;
            whisperAudio.volume = 0.04;
            whisperAudio.play().catch(() => {});
        }
        function stopWhisper() {
            whisperActive = false;
            whisperAudio.pause();
            whisperAudio.currentTime = 0;
        }

        let currentNodeKey = '';
        function renderScene(nodeKey) {
            currentNodeKey = resolveNode(nodeKey);
            // Résolution de phase : remplacer le noeud si override existe
            const resolvedKey = resolveNode(nodeKey);
            currentNode = story[resolvedKey];
            if (!currentNode) { console.error('Noeud introuvable:', resolvedKey); return; }
            currentNode.actionExecuted = false;

            // ===== Mise à jour du titre de l'onglet =====
            updateTabTitle(nodeKey);

            // ===== beforeunload actif dès pre_glitch_01 =====
            if (currentNode.scary || currentNode.glitch) finalSequenceActive = true;

            // ===== JUMPSCARE =====
            if (currentNode.jumpscare && !currentNode.jumpscareShown) {
                currentNode.jumpscareShown = true;
                triggerJumpscare(() => renderScene(nodeKey));
                return;
            }

            // ===== FAUX CRASH (phase 2) =====
            if (currentNode.fakeCrash) {
                triggerFakeCrash(() => {
                    currentNode.fakeCrash = false; // ne se redéclenche pas
                    renderScene(resolvedKey);
                });
                return;
            }

            // ===== MID FREEZE (phase 3) =====
            if (currentNode.midFreeze) {
                triggerMidFreeze(() => {
                    currentNode.midFreeze = false;
                    renderScene(resolvedKey);
                });
                return;
            }

            // ===== BULLE VIDE (phase 5) =====
            if (currentNode.emptyBubble) {
                gameContainer.style.backgroundImage = currentNode.bg;
                if (gamePhase >= 4) applyPhase5Visual();
                nameBox.style.display = 'block';
                nameBox.textContent = getNodeText(currentNodeKey).speaker || currentNode.speaker;
                storyTextElement.textContent = '';
                nextIndicator.style.display = 'none';
                isTyping = false; currentFullText = '';
                setTimeout(() => { if (currentNode.next) renderScene(currentNode.next); }, 2500);
                return;
            }

            // ===== ERREURS EN BOUCLE (phase 5) =====
            if (currentNode.phase5errors && !currentNode.errorsShown) {
                currentNode.errorsShown = true;
                gameContainer.style.backgroundImage = currentNode.bg;
                if (gamePhase >= 4) applyPhase5Visual();
                nameBox.style.display = 'block';
                nameBox.textContent = currentNode.speaker;
                typeWriterEffect(getNodeText(currentNodeKey).text || currentNode.text);
                startErrorLoop();
                setTimeout(() => { stopErrorLoop(); if (currentNode.next) renderScene(currentNode.next); }, 7000);
                return;
            }

            // ===== FINALE PHASE 5 =====
            if (currentNode.phase5finale) {
                onGameEnd();
                triggerPhase5Finale();
                return;
            }

            // ===== FIN PHASE 6 =====
            if (currentNode.phase6end) {
                triggerPhase6Thanks();
                return;
            }

            // ===== COUPURE PHASE 4 =====
            if (currentNode.phase4split && !currentNode.splitDone) {
                currentNode.splitDone = true;
                gameContainer.style.backgroundImage = 'none';
                gameContainer.style.background = 'black';
                nameBox.style.display = 'block';
                nameBox.textContent = currentNode.speaker;
                storyTextElement.classList.add('red-mode');
                nameBox.classList.add('red-mode');
                dialogueBox.classList.add('red-mode');
                dialogueBox.style.pointerEvents = 'none';
                startScaryGlitch(5);
                charCenter.style.display = 'block';
                charCenter.src = 'hamster_triste.png';
                charCenter.classList.add('scary-shake');
                typeWriterEffect(currentNode.text);
                // fin.mp3 LOUD immédiatement, coupe tout
                stopAllMusic();
                setTimeout(() => {
                    const finAudio = new Audio('fin.mp3');
                    finAudio.volume = 1.0;
                    finAudio.play().catch(() => {});
                    window._finAudio = finAudio;
                }, 800);
                // Après 2s : sang qui coule + tremble + bugs
                setTimeout(() => {
                    charCenter.src = 'hamster_choc.png';
                    triggerBloodDeath(() => {
                        // Foncer dans l'écran
                        charCenter.style.transition = 'transform 0.4s ease-in';
                        charCenter.style.transform = 'scale(8)';
                        setTimeout(() => {
                            setSave('4');
                            setTimeout(() => showSplashThenMenu(), 600);
                        }, 400);
                    });
                }, 2500);
                return;
            }

            // ===== FIN PHASE 3 =====
            if (currentNode.phase3end) {
                setSave('3');
                gameContainer.style.backgroundImage = 'none';
                gameContainer.style.background = 'black';
                nameBox.style.display = 'block';
                nameBox.textContent = currentNode.speaker;
                storyTextElement.classList.add('red-mode');
                dialogueBox.style.pointerEvents = 'none'; // no skip
                startScaryGlitch(6);
                setCursedCursor(true);
                charCenter.style.display = 'block';
                charCenter.src = 'hamster_choc.png';
                charCenter.classList.add('scary-shake');
                // Typewriter très lent (80ms/char)
                isTyping = true;
                let p3i = 0;
                const p3text = currentNode.text;
                storyTextElement.textContent = '';
                const p3interval = setInterval(() => {
                    storyTextElement.textContent += p3text[p3i++];
                    if (p3i >= p3text.length) {
                        clearInterval(p3interval);
                        isTyping = false;
                    }
                }, 80);
                // 10 secondes après le début → transition
                setTimeout(() => {
                    clearInterval(p3interval);
                    dialogueBox.style.pointerEvents = 'auto';
                    triggerPhase3End();
                }, 10000);
                return;
            }

            gameContainer.style.backgroundImage = currentNode.bg;

            if (currentNode.music) {
                if (!reversedMusicActive) {
                    playMusic(currentNode.music);
                    bgm.playbackRate = 1.0;
                }
            }

            if (currentNode.slowMusic) {
                setTimeout(() => slowDownMusic(0.82, 18000), 2000);
            }

            if (currentNode.dream) {
                gameContainer.classList.add('dream-mode');
                if (!reversedMusicActive) bgm.playbackRate = 0.72;
            } else {
                gameContainer.classList.remove('dream-mode');
                if (!currentNode.scary && !currentNode.glitch && !currentNode.slowMusic && !reversedMusicActive) {
                    bgm.playbackRate = 1.0;
                }
            }

            if (currentNode.whisper) startWhisper();
            else stopWhisper();

            const _i18n = getNodeText(currentNodeKey);
            if (_i18n.speaker && _i18n.speaker.trim() !== "") {
                nameBox.style.display = 'block';
                nameBox.textContent = _i18n.speaker;
            } else {
                nameBox.style.display = 'none';
            }

            if (currentNode.glitch) {
                storyTextElement.classList.add('glitch-mode');
                nameBox.classList.add('glitch-mode');
                dialogueBox.classList.add('glitch-mode');
                storyTextElement.classList.remove('red-mode');
                nameBox.classList.remove('red-mode');
                dialogueBox.classList.remove('red-mode');
                gameContainer.classList.remove('dream-mode');
                stopScaryGlitch();
                dialogueContainer.classList.add('sink');
                document.body.classList.add('no-cursor');
                document.body.classList.remove('hamster-cursor');
            } else if (currentNode.scary) {
                storyTextElement.classList.add('red-mode');
                nameBox.classList.add('red-mode');
                dialogueBox.classList.add('red-mode');
                storyTextElement.classList.remove('glitch-mode');
                nameBox.classList.remove('glitch-mode');
                dialogueBox.classList.remove('glitch-mode');
                startScaryGlitch(currentNode.scaryLevel || 0);
                setCursedCursor(true);
            } else {
                storyTextElement.classList.remove('glitch-mode');
                nameBox.classList.remove('glitch-mode');
                dialogueBox.classList.remove('glitch-mode');
                storyTextElement.classList.remove('red-mode');
                nameBox.classList.remove('red-mode');
                dialogueBox.classList.remove('red-mode');
                storyTextElement.style.color = '';
                stopScaryGlitch();
                setCursedCursor(false);
            }

            // --- Jean-Eudes mort : texte corrompu + image bug ---
            if (jeanEudesDead && currentNode.speaker === 'Jean-Eudes') {
                if (!currentNode._corruptedText) currentNode._corruptedText = corruptText(currentNode.text);
                currentNode.text = currentNode._corruptedText;
                if (SIDE_CHARS['Jean-Eudes']) SIDE_CHARS['Jean-Eudes'].src = 'jean_eude_bug.png';
            }

            updateSideCharacters(currentNode);

            const isSideSpeaker = !!SIDE_CHARS[currentNode.speaker || ""];
            if (currentNode.emotion === "hidden") {
                charCenter.style.display = 'none';
                charCenter.classList.remove('scary-shake');
            } else {
                charCenter.style.display = 'block';
                charCenter.src = `hamster_${currentNode.emotion}.png`;
                if (currentNode.scary || currentNode.glitch) {
                    charCenter.classList.add('scary-shake');
                    charCenter.style.filter = "drop-shadow(0px 0px 15px rgba(180,0,0,0.7))";
                } else {
                    charCenter.classList.remove('scary-shake');
                    charCenter.style.filter = isSideSpeaker
                        ? "brightness(0.4) drop-shadow(0px 10px 30px rgba(0,0,0,0.5))"
                        : "drop-shadow(0px 10px 30px rgba(0,0,0,0.5))";
                }
            }

            // --- Choix ---
            choicesAreaElement.innerHTML = '';
            if (currentNode.choices) {
                const buttons = [];
                currentNode.choices.forEach(choice => {
                    const button = document.createElement('button');
                    button.textContent = (getLang()==='en' && choice.textEn) ? choice.textEn : choice.text;
                    button.classList.add('choice-btn');
                    if (choice.fake) {
                        button.addEventListener('click', (e) => {
                            e.stopPropagation();
                            playSound('clic.ogg');
                            button.classList.add('fake-vanish');
                        });
                    } else {
                        button.addEventListener('click', (e) => {
                            e.stopPropagation();
                            playSound('clic.ogg');
                            renderScene(choice.nextNode);
                        });
                    }
                    choicesAreaElement.appendChild(button);
                    buttons.push(button);
                });
                // Phase 3 : corrompre les labels après un court délai
                if (corruptChoicesMode) {
                    setTimeout(() => corruptChoiceLabels(buttons), 800);
                }
            }

            // --- Texte qui se réécrit (phase 2) ---
            if (currentNode.rewrite && !currentNode.rewriteDone) {
                currentNode.rewriteDone = true;
                selfRewriteText(currentNode.rewrite.original, currentNode.rewrite.rewritten, () => {
                    onTextFinished();
                });
            } else {
                typeWriterEffect(_i18n.text);
            }
        }

        // ===== INIT LANGUE (une seule fois) =====
        (function initLang() {
            function updateLangBtns() {
                const l = getLang();
                document.getElementById('lang-en').classList.toggle('active', l === 'en');
                document.getElementById('lang-fr').classList.toggle('active', l === 'fr');
            }
            updateLangBtns();
            function applyLangUI() {
                const l = getLang();
                ['menu-eyebrow','menu-subtitle'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = el.dataset[l] || el.textContent;
                });
                updateMenuForPhase();
            }
            applyLangUI();
            document.getElementById('lang-en').addEventListener('click', () => {
                setLang('en'); updateLangBtns(); applyLangUI();
            });
            document.getElementById('lang-fr').addEventListener('click', () => {
                setLang('fr'); updateLangBtns(); applyLangUI();
            });
            // Exposer pour appel depuis showSplashThenMenu si besoin
            window.updateLangBtns = updateLangBtns;
        })();

        // ===== LANCEMENT INITIAL =====
        // Bouton load du menu
        document.getElementById('load-btn').addEventListener('click', () => {
            loadCheckpointFromMenu();
        });

        // Boutons save/load in-game
        document.getElementById('btn-save').addEventListener('click', (e) => {
            e.stopPropagation();
            saveCheckpoint();
        });
        document.getElementById('btn-load').addEventListener('click', (e) => {
            e.stopPropagation();
            loadCheckpoint();
        });

        // Afficher le splash au premier chargement puis le menu
        (function initSplash() {
            // Cacher le menu immédiatement
            mainMenu.style.display = 'none';
            showSplash(() => {
                mainMenu.style.display = 'flex';
                mainMenu.style.opacity = '0';
                setTimeout(() => { mainMenu.style.opacity = '1'; }, 50);
                updateLoadButton();
                // Musique menu
                const _launch = () => {
                    document.removeEventListener('click', _launch);
                    document.removeEventListener('keydown', _launch);
                    document.removeEventListener('mouseenter', _launch);
                    if (gamePhase === 2 || gamePhase === 3) startReversedMusic();
                    else if (gamePhase !== 4) playMusic('menu_hamster.mp3');
                };
                document.addEventListener('click', _launch);
                document.addEventListener('keydown', _launch);
                document.addEventListener('mouseenter', _launch);
            });
        })();

    </script>
</body>
</html>
