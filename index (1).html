<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petites Pattes, Grand Amour (test)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; overflow: hidden; user-select: none;
        }

        /* ===== MENU PRINCIPAL — STYLE DDLC ===== */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Fredoka+One&display=swap');

        /* =============================================
           MENU PRINCIPAL — style DDLC, palette bleue
           ============================================= */
        #main-menu {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: block;
            z-index: 100; transition: opacity 1s;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }

        /* Fond DROIT — pois bleus (plein écran, la courbe le masquera à gauche) */
        #menu-bg {
            position: absolute; inset: 0; z-index: 0;
            background-color: #eef5ff;
            background-image: radial-gradient(circle, rgba(100,165,255,0.28) 0%, rgba(100,165,255,0.28) 44%, transparent 45%);
            background-size: 86px 86px;
        }

        /* Panneau GAUCHE blanc — SVG en position absolue qui couvre la gauche avec une courbe */
        #menu-divider {
            position: absolute; inset: 0; z-index: 2;
            pointer-events: none;
        }
        /* L'élément SVG est injecté via JS pour être responsive — voir bas */

        /* ---- BADGE LOGO — grand, déborde en coin haut-gauche ---- */
        #menu-left {
            position: absolute;
            top: -80px;
            left: -80px;
            z-index: 12;
        }
        #menu-logo-badge {
            width: 400px; height: 400px;
            background: white;
            border-radius: 50%;
            border: 5px solid rgba(60,120,220,0.22);
            box-shadow: 0 8px 36px rgba(60,120,220,0.18), inset 0 0 0 8px rgba(60,120,220,0.05);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 60px 28px 0 28px;
            box-sizing: border-box; text-align: center;
        }
        #menu-eyebrow {
            font-size: 0.6rem; font-weight: 800;
            color: #5a9ae0; letter-spacing: 0.22em;
            text-transform: uppercase; margin: 0 0 4px 0;
        }
        #game-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.1rem; line-height: 1.08;
            margin: 0; color: #1a4d9f;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.95);
            letter-spacing: 0.01em; text-align: center;
        }
        #menu-subtitle {
            font-size: 0.56rem; color: #7aabdf;
            letter-spacing: 0.16em; text-transform: uppercase;
            margin: 5px 0 0 0; font-weight: 700;
        }

        /* ---- BOUTONS bas gauche ---- */
        #menu-buttons {
            position: absolute; bottom: 52px; left: 36px;
            display: flex; flex-direction: column;
            gap: 2px; z-index: 10;
        }
        #menu-buttons button {
            font-family: 'Nunito', sans-serif;
            font-size: 1.22rem; font-weight: 800;
            padding: 5px 0;
            background: transparent; border: none;
            color: #1a4d9f; cursor: pointer; text-align: left;
            letter-spacing: 0.02em;
            transition: color 0.15s, transform 0.15s;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.9);
            -webkit-text-stroke: 0.3px rgba(60,120,220,0.25);
        }
        #menu-buttons button:hover  { color: #3a7bd5; transform: translateX(7px); }
        #menu-buttons button:active { color: #0d3570; transform: translateX(3px); }
        #dev-btn {
            font-size: 0.68rem !important; font-weight: 600 !important;
            color: rgba(60,120,210,0.28) !important;
            -webkit-text-stroke: 0 !important; margin-top: 6px;
        }
        #dev-btn:hover { color: rgba(60,120,210,0.6) !important; }

        #lang-selector {
            position: absolute; bottom: 52px; right: 20px;
            display: flex; gap: 10px; z-index: 10; align-items: center;
        }
        .lang-btn {
            background: transparent; border: 3px solid transparent;
            border-radius: 6px; padding: 3px; cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
        }
        .lang-btn img { display: block; border-radius: 3px; }
        .lang-btn.active {
            border-color: #1a4d9f;
            box-shadow: 0 2px 10px rgba(26,77,159,0.3);
        }
        .lang-btn:hover { transform: scale(1.08); }
        #menu-version {
            position: absolute; bottom: 12px; right: 18px;
            font-size: 0.6rem; color: rgba(60,120,210,0.38);
            letter-spacing: 0.1em; z-index: 10;
        }

        /* ---- PERSONNAGES pleine hauteur, décalés à droite ---- */
        #menu-right {
            position: absolute; inset: 0;
            display: flex; align-items: flex-end;
            justify-content: flex-end;
            padding-right: 4vw;
            z-index: 4; pointer-events: none;
        }
        .menu-character {
            height: min(93vh, 93%);
            width: auto; object-fit: contain; object-position: bottom;
            filter: drop-shadow(-4px 0 16px rgba(60,120,220,0.09));
            transition: opacity 0.5s, filter 0.5s;
        }
        #menu-char-je { display: none; }
        #menu-char-pg { z-index: 4; }

        /* ---- SVG courbe (injecté dynamiquement) ---- */
        #menu-curve-svg {
            position: absolute; inset: 0; z-index: 3;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* Modale dev — bleu */
        /* Modale dev — bleu */
        #dev-modal {
            display: none; position: fixed; inset: 0; z-index: 9000;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
        }
        #dev-modal.open { display: flex; }
        #dev-modal-inner {
            background: #f0f6ff; border: 2px solid #7aabdf;
            border-radius: 16px; padding: 28px 36px;
            font-family: 'Nunito', sans-serif;
            min-width: 300px; text-align: center;
        }
        #dev-modal-inner h3 { color: #1a4d8f; font-size: 1.3rem; margin: 0 0 8px; }
        #dev-modal-inner p  { font-size: 0.82rem; color: #4a7fc1; margin: 0 0 16px; }
        #dev-code-input {
            width: 100%; box-sizing: border-box;
            padding: 10px 14px; border-radius: 10px;
            border: 2px solid #7aabdf; font-size: 1.1rem;
            background: white; margin-bottom: 14px;
            outline: none; text-align: center;
            font-family: 'Nunito', sans-serif;
        }
        #dev-code-input:focus { border-color: #3a7bd5; }
        #dev-phase-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; display: none; }
        .dev-phase-btn {
            padding: 8px 18px; border-radius: 20px; border: none;
            background: linear-gradient(135deg, #5b9fef, #2a6dd5);
            color: white; font-family: 'Nunito', sans-serif;
            font-size: 0.82rem; cursor: pointer;
        }
        .dev-phase-btn:hover { filter: brightness(1.1); }
        #dev-close {
            color: #6a9fd8; cursor: pointer; font-size: 0.8rem;
            background: none; border: none;
            font-family: 'Nunito', sans-serif;
            margin-top: 10px; display: block; width: 100%;
        }
        #dev-error { color: #c05050; font-size: 0.78rem; margin: -8px 0 10px; display: none; }
        #dev-scene-section { display: none; margin-top: 14px; }
        #dev-scene-section label { font-size: 0.78rem; color: #4a7fc1; display: block; margin-bottom: 6px; }
        #dev-phase-select, #dev-scene-select {
            width: 100%; padding: 7px 10px; border-radius: 8px;
            border: 1.5px solid #7aabdf; background: white;
            font-family: 'Nunito', sans-serif; font-size: 0.82rem;
            color: #1a4d8f; margin-bottom: 10px; cursor: pointer;
        }
        #dev-scene-go {
            padding: 7px 22px; border-radius: 20px; border: none;
            background: linear-gradient(135deg, #5b9fef, #2a6dd5);
            color: white; font-family: 'Nunito', sans-serif;
            font-size: 0.82rem; cursor: pointer; width: 100%;
        }
        #dev-scene-go:hover { filter: brightness(1.1); }
        #load-btn { display: none; }

        /* Responsive */
        @media (max-width: 700px) {
            #menu-left { padding: 18px 0 0 16px; }
            #menu-logo-badge { width: 140px; height: 140px; }
            #game-title { font-size: 1.1rem; }
            #menu-buttons { bottom: 36px; left: 20px; }
            #menu-buttons button { font-size: 1rem; }
        }
        @media (max-width: 480px) {
            .menu-character { height: 60vh; }
            #menu-buttons button { font-size: 0.9rem; }
        }


        #game-container {
            display: none; position: relative; width: 100vw; height: 100vh;
            background-size: cover; background-position: center; transition: background 0.5s;
        }

        /* ===== SYSTÈME MULTI-PERSONNAGES (DDLC STYLE) ===== */
        #characters-container {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 75vh; pointer-events: none;
        }

        .character-sprite {
            position: absolute;
            bottom: 25vh;
            height: clamp(40vh, 60vh, 65vh);
            max-width: 45vw;
            object-fit: contain;
            filter: drop-shadow(0px 10px 30px rgba(0,0,0,0.5));
            transition: opacity 0.3s, filter 0.4s;
            display: none;
        }
        .char-left  { left: 2%; }
        .char-center { left: 50%; transform: translateX(-50%); }
        .char-right { right: 2%; }

        #dialogue-container {
            position: absolute; bottom: 0; width: 100%;
            height: clamp(26vh, 30vh, 34vh);
            display: flex; flex-direction: column; justify-content: flex-end;
            z-index: 50;
        }

        #name-box {
            position: absolute; top: -20px; left: 50px;
            background-color: #3a7bd5; color: white;
            padding: 7px 22px; font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            font-weight: bold; border-radius: 10px; border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: none; z-index: 10;
        }

        #dialogue-box {
            position: relative; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); border-top: 4px solid #3a7bd5;
            box-sizing: border-box;
            padding: clamp(28px, 5vh, 40px) clamp(18px, 5vw, 50px) 18px;
            display: flex; flex-direction: column; cursor: pointer;
        }

        #story-text {
            font-size: clamp(0.85rem, 2.2vw, 1.3rem);
            margin: 0; flex-grow: 1; line-height: 1.6;
            text-shadow: 1px 1px 2px black; white-space: pre-wrap;
        }

        #next-indicator {
            position: absolute; bottom: 12px; right: 24px;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #5b9fef; animation: blink 1s infinite;
            display: none; pointer-events: none;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        #choices-area {
            position: absolute;
            top: clamp(-180px, -20vh, -120px);
            left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column;
            gap: clamp(8px, 1.5vh, 15px);
            justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.5s;
            pointer-events: none; width: 88%; z-index: 60;
        }

        .choice-btn {
            background-color: rgba(0,0,0,0.82); color: white;
            border: 2px solid #3a7bd5;
            padding: clamp(10px, 2vh, 15px) clamp(14px, 3vw, 30px);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            border-radius: 8px; cursor: pointer;
            transition: all 0.2s; font-weight: bold;
            width: 100%; max-width: 600px;
        }
        .choice-btn:hover { background-color: #3a7bd5; transform: scale(1.02); }

        /* ===== RESPONSIVE JEU — mobile ===== */
        @media (max-width: 600px) {
            .character-sprite { bottom: 26vh; height: 42vh; }
            #dialogue-container { height: 32vh; }
            #name-box { left: 16px; font-size: 0.85rem; padding: 5px 14px; }
        }

        /* ===== JUMPSCARE OVERLAY ===== */
        #jumpscare-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            z-index: 999;
            justify-content: center; align-items: center;
            overflow: hidden;
        }
        #jumpscare-overlay.active { display: flex; }

        /* Flash blanc initial */
        #jumpscare-flash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: white; opacity: 0; pointer-events: none;
            z-index: 1000;
            transition: opacity 0s;
        }
        #jumpscare-flash.fire {
            opacity: 1;
            transition: opacity 0.18s ease-out;
        }

        /* L'image grossit lentement vers le joueur */
        @keyframes jumpscare-advance {
            0%   { transform: scale(0.85); opacity: 0; }
            8%   { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1.12); opacity: 1; }
        }
        #jumpscare-overlay img {
            width: 92vw; height: 92vh;
            object-fit: contain;
            animation: jumpscare-advance 3s ease-in forwards;
        }

        /* Vibration initiale de l'écran */
        @keyframes jumpscare-screen-shake {
            0%,100% { transform: translate(0,0); }
            10% { transform: translate(-12px, 8px); }
            20% { transform: translate(10px, -10px); }
            30% { transform: translate(-14px, 6px); }
            40% { transform: translate(12px, -8px); }
            50% { transform: translate(-10px, 12px); }
            60% { transform: translate(14px, -6px); }
            70% { transform: translate(-8px, 10px); }
            80% { transform: translate(10px, -12px); }
            90% { transform: translate(-12px, 8px); }
        }
        body.jumpscare-shake {
            animation: jumpscare-screen-shake 0.35s steps(1) forwards;
        }

        /* Texte de la scène qui reste en rouge pendant le jumpscare */
        #jumpscare-text {
            position: fixed; bottom: 8vh; left: 50%; transform: translateX(-50%);
            color: #cc0000; font-size: 1.1rem; font-weight: bold;
            text-shadow: 0 0 10px rgba(200,0,0,0.8);
            z-index: 1001; pointer-events: none;
            opacity: 0; transition: opacity 0.4s;
            max-width: 80vw; text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #jumpscare-text.visible { opacity: 1; }

        /* ===== GLITCH BG (corruption visuelle aléatoire) ===== */
        @keyframes glitch-bg-anim {
            0%   { filter: hue-rotate(0deg)   saturate(1)  contrast(1)   brightness(1); transform: translate(0,0); }
            15%  { filter: hue-rotate(180deg) saturate(8)  contrast(3)   brightness(0.7); transform: translate(-4px, 2px); }
            30%  { filter: hue-rotate(90deg)  saturate(12) contrast(2.5) brightness(1.2); transform: translate(3px, -3px); }
            50%  { filter: hue-rotate(270deg) saturate(6)  contrast(4)   brightness(0.5); transform: translate(-2px, 4px); }
            70%  { filter: hue-rotate(45deg)  saturate(10) contrast(3)   brightness(0.8); transform: translate(4px, -2px); }
            100% { filter: hue-rotate(0deg)   saturate(1)  contrast(1)   brightness(1); transform: translate(0,0); }
        }
        #game-container.glitch-bg {
            animation: glitch-bg-anim 0.22s steps(1) forwards;
        }

        /* ===== EFFETS GLITCH (FIN DU JEU) ===== */
        @keyframes glitch-shake {
            0%,  100% { transform: translate(0, 0) rotate(0deg); }
            10%  { transform: translate(-4px, 3px) rotate(-0.6deg); }
            20%  { transform: translate(4px, -2px) rotate(0.6deg); }
            30%  { transform: translate(-3px, 4px) rotate(-0.4deg); }
            40%  { transform: translate(3px, -3px) rotate(0.5deg); }
            50%  { transform: translate(-4px, 2px) rotate(-0.6deg); }
            60%  { transform: translate(4px, 3px) rotate(0.4deg); }
            70%  { transform: translate(-2px, -4px) rotate(-0.5deg); }
            80%  { transform: translate(3px, 2px) rotate(0.6deg); }
            90%  { transform: translate(-3px, 3px) rotate(-0.4deg); }
        }

        #story-text.glitch-mode {
            color: #ff0000 !important;
            font-weight: bold !important;
            animation: glitch-shake 0.07s infinite !important;
            text-shadow: 3px 0 #ff0000, -3px 0 #00ffff, 0 2px #ff0000 !important;
            letter-spacing: 2px;
        }

        #name-box.glitch-mode {
            background-color: #cc0000 !important;
            border-color: #ff4444 !important;
            animation: glitch-shake 0.07s infinite !important;
            color: #fff !important;
        }

        #dialogue-box.glitch-mode {
            border-top-color: #ff0000 !important;
            background: rgba(40, 0, 0, 0.97) !important;
        }

        /* ===== MODE TEXTE ROUGE (dialogues effrayants pré-glitch) ===== */
        #story-text.red-mode {
            color: #cc0000 !important;
            font-weight: bold !important;
            text-shadow: 0 0 8px rgba(200, 0, 0, 0.6) !important;
        }

        #name-box.red-mode {
            background-color: #8b0000 !important;
            border-color: #cc0000 !important;
        }

        #dialogue-box.red-mode {
            border-top-color: #8b0000 !important;
            background: rgba(20, 0, 0, 0.95) !important;
        }

        /* ===== LÉGÈRE VIBRATION DU HAMSTER (scènes scary) ===== */
        @keyframes subtle-shake {
            0%,  100% { transform: translateX(-50%) translate(0, 0); }
            20%        { transform: translateX(-50%) translate(-1.5px, 1px); }
            40%        { transform: translateX(-50%) translate(1.5px, -1px); }
            60%        { transform: translateX(-50%) translate(-1px, 1.5px); }
            80%        { transform: translateX(-50%) translate(1px, -1.5px); }
        }

        #char-center.scary-shake {
            animation: subtle-shake 0.18s infinite !important;
        }

        /* ===== OVERLAY NOIRCISSEMENT PROGRESSIF ===== */
        #darkness-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; opacity: 0; pointer-events: none;
            z-index: 80; transition: opacity 1.2s ease;
        }

        /* ===== TREMBLEMENT DE LA BOÎTE DE DIALOGUE (5 niveaux) ===== */
        @keyframes box-shake-1 {
            0%,100% { transform: translate(0,0); }
            50%     { transform: translate(-1px, 0.5px); }
        }
        @keyframes box-shake-2 {
            0%,100% { transform: translate(0,0); }
            25%     { transform: translate(-2px, 1px); }
            75%     { transform: translate(1.5px, -1px); }
        }
        @keyframes box-shake-3 {
            0%,100% { transform: translate(0,0); }
            20%     { transform: translate(-3px, 2px); }
            50%     { transform: translate(2px, -2px); }
            80%     { transform: translate(-2px, 1px); }
        }
        @keyframes box-shake-4 {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            15%     { transform: translate(-4px, 2px) rotate(-0.3deg); }
            40%     { transform: translate(3px, -3px) rotate(0.3deg); }
            65%     { transform: translate(-3px, 2px) rotate(-0.2deg); }
            85%     { transform: translate(3px, 1px) rotate(0.2deg); }
        }
        @keyframes box-shake-5 {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            10%     { transform: translate(-6px, 3px) rotate(-0.5deg); }
            30%     { transform: translate(5px, -4px) rotate(0.5deg); }
            50%     { transform: translate(-5px, 4px) rotate(-0.4deg); }
            70%     { transform: translate(4px, -3px) rotate(0.4deg); }
            90%     { transform: translate(-4px, 2px) rotate(-0.3deg); }
        }
        #dialogue-container.box-shake-1 { animation: box-shake-1 0.4s infinite; }
        #dialogue-container.box-shake-2 { animation: box-shake-2 0.3s infinite; }
        #dialogue-container.box-shake-3 { animation: box-shake-3 0.22s infinite; }
        #dialogue-container.box-shake-4 { animation: box-shake-4 0.16s infinite; }
        #dialogue-container.box-shake-5 { animation: box-shake-5 0.10s infinite; }

        /* ===== SLIDE FINAL DE LA BOÎTE (glitch terminal) ===== */
        @keyframes dialogue-sink {
            0%   { transform: translateY(0); }
            100% { transform: translateY(60vh); }
        }
        #dialogue-container.sink {
            animation: dialogue-sink 8s ease-in forwards;
        }

        /* ===== CURSEUR CACHÉ (glitch terminal) ===== */
        body.no-cursor, body.no-cursor * { cursor: none !important; }

        /* ===== MODE CURSÉ (reload après fin) ===== */
        @keyframes cursed-spin {
            from { transform: rotate(0deg) scale(1); }
            to   { transform: rotate(360deg) scale(1); }
        }
        @keyframes cursed-shake-wild {
            0%,100% { transform: translate(0,0) rotate(0deg) scale(1); }
            10% { transform: translate(-20px, 15px) rotate(-8deg) scale(1.05); }
            25% { transform: translate(18px, -12px) rotate(12deg) scale(0.93); }
            40% { transform: translate(-25px, 20px) rotate(-15deg) scale(1.08); }
            55% { transform: translate(22px, -18px) rotate(10deg) scale(0.90); }
            70% { transform: translate(-15px, 25px) rotate(-12deg) scale(1.12); }
            85% { transform: translate(20px, -20px) rotate(16deg) scale(0.88); }
        }
        @keyframes cursed-color {
            0%   { filter: hue-rotate(0deg)   saturate(1)  invert(0)   brightness(1); }
            20%  { filter: hue-rotate(90deg)  saturate(8)  invert(0)   brightness(0.6); }
            40%  { filter: hue-rotate(180deg) saturate(15) invert(1)   brightness(1.4); }
            60%  { filter: hue-rotate(270deg) saturate(5)  invert(0)   brightness(0.4); }
            80%  { filter: hue-rotate(45deg)  saturate(20) invert(0.5) brightness(1.2); }
            100% { filter: hue-rotate(360deg) saturate(1)  invert(1)   brightness(1); }
        }
        @keyframes cursed-text-flicker {
            0%,100% { opacity: 1; color: #ff0000; }
            25%  { opacity: 0.3; color: #00ffff; }
            50%  { opacity: 0.8; color: #ff00ff; }
            75%  { opacity: 0.1; color: #ffff00; }
        }
        body.cursed-1 #main-menu {
            filter: hue-rotate(180deg) saturate(5);
        }
        body.cursed-2 #main-menu {
            animation: cursed-color 0.8s infinite;
        }
        body.cursed-2 #game-title, body.cursed-2 #start-btn {
            animation: cursed-text-flicker 0.4s infinite;
        }
        body.cursed-3 #main-menu {
            animation: cursed-color 0.4s infinite, cursed-shake-wild 0.3s infinite;
        }
        body.cursed-3 * {
            animation: cursed-text-flicker 0.2s infinite !important;
        }
        body.cursed-4 {
            animation: cursed-spin 0.6s linear infinite;
            overflow: visible !important;
        }
        body.cursed-4 #main-menu {
            animation: cursed-color 0.15s infinite, cursed-shake-wild 0.12s infinite !important;
            transform-origin: center;
        }
        body.cursed-4 * {
            animation: cursed-text-flicker 0.08s infinite, cursed-shake-wild 0.15s infinite !important;
        }

        /* ===== CURSEUR HAMSTER (scènes scary) ===== */
        body.hamster-cursor, body.hamster-cursor * {
            cursor: url('hamster_choc.png') 16 16, crosshair !important;
        }

        /* ===== SCÈNE DE RÊVE ===== */
        #game-container.dream-mode {
            filter: blur(1.5px) brightness(0.7) saturate(0.4);
        }
        #game-container.dream-mode #story-text {
            filter: blur(0.6px);
            letter-spacing: 0.05em;
            font-style: italic;
            color: #c8b8d8 !important;
        }
        #game-container.dream-mode #name-box {
            background: rgba(80, 40, 100, 0.8) !important;
            border-color: #9966bb !important;
            letter-spacing: 0.1em;
        }
        #game-container.dream-mode #dialogue-box {
            border-top-color: #9966bb !important;
            background: rgba(20, 10, 30, 0.92) !important;
        }

        /* ===== FAUX CHOIX (disparaissent au clic) ===== */
        .choice-btn.fake-vanish {
            transition: opacity 0.15s, transform 0.15s !important;
            opacity: 0 !important;
            transform: scale(0.92) !important;
            pointer-events: none !important;
        }

        /* ===== TOAST SAUVEGARDE ===== */
        #save-toast {
            position: fixed; bottom: 28px; right: 28px;
            background: rgba(20, 20, 20, 0.92); color: #aaffaa;
            font-family: 'Segoe UI', sans-serif; font-size: 0.95rem;
            padding: 10px 20px; border-radius: 20px;
            border: 1px solid #44aa44;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s;
            z-index: 5000;
        }
        #save-toast.visible { opacity: 1; }

        /* ===== BOUTON RESET DEBUG ===== */
        #reset-btn {
            position: fixed; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.5); color: #555;
            border: 1px solid #333; font-size: 0.65rem;
            padding: 4px 8px; border-radius: 4px;
            cursor: pointer; z-index: 9999;
            font-family: monospace;
        }
        #reset-btn:hover { color: #999; border-color: #555; }


        /* ===== PHASE 4 MENU ===== */
        body.phase4-menu #menu-bg {
            background: linear-gradient(160deg, #1a0010 0%, #2d0020 40%, #1a0030 100%) !important;
        }
        body.phase4-menu #game-title { color: #800020 !important; text-shadow: 2px 2px 0 #000 !important; }
        body.phase4-menu #menu-subtitle { color: #001560 !important; }

        /* ===== PHASE 5 MENU ===== */
        body.phase5-menu #menu-bg {
            background: #050005 !important;
        }
        body.phase5-menu #menu-char-je,
        body.phase5-menu #menu-char-pg { opacity: 0 !important; }
        body.phase6-menu #menu-char-je { display: flex !important; opacity: 1 !important; }
        body.phase5-menu #game-title { color: #2a002a !important; }

        /* ===== PHASE 5 JEU — carrés noir/mauve ===== */
        #game-container.phase5-mode {
            background: #0d000d !important;
            background-image: none !important;
        }
        #game-container.phase5-mode::before {
            content: '';
            position: absolute; inset: 0; z-index: 1;
            background:
                repeating-linear-gradient(0deg,
                    transparent, transparent 59px,
                    rgba(80,0,80,0.15) 60px
                ),
                repeating-linear-gradient(90deg,
                    transparent, transparent 59px,
                    rgba(80,0,80,0.15) 60px
                );
        }
        /* Sprites en phase 5 : remplacés visuellement par des rectangles mauve/noir */
        #game-container.phase5-mode .character-sprite {
            filter: brightness(0) sepia(1) hue-rotate(260deg) saturate(3) !important;
            opacity: 0.4 !important;
        }
        /* Boîte dialogue phase 5 */
        #game-container.phase5-mode #dialogue-box {
            background: rgba(10, 0, 15, 0.97) !important;
            border-top-color: #5a005a !important;
        }
        #game-container.phase5-mode #name-box {
            background: #2a0030 !important;
            border-color: #5a005a !important;
        }

        /* ===== ERREURS EN BOUCLE (phase 5) ===== */
        .error-line {
            position: fixed;
            font-family: monospace; font-size: 0.75rem;
            color: #aa0000; pointer-events: none;
            z-index: 200; white-space: nowrap;
            animation: error-fade 2.5s ease-out forwards;
        }
        @keyframes error-fade {
            0%   { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        /* ===== COUPURE EN DEUX (phase 4 fin) ===== */
        /* Canvas split + particules (tout sur un seul canvas) */
        #particles-canvas {
            position: fixed; inset: 0; z-index: 501;
            pointer-events: none; display: none;
        }

        /* ===== OVERLAY FINALE PHASE 5 ===== */
        #phase5-overlay {
            display: none; position: fixed; inset: 0;
            background: black; z-index: 600;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #phase5-overlay.active { display: flex; }

        #phase5-sprite {
            position: absolute;
            width: min(80vw, 80vh);
            object-fit: contain;
            opacity: 0;
            bottom: 20vh;
            transition: opacity 3s ease;
            filter: drop-shadow(0 0 60px rgba(255,200,200,0.3));
        }
        #phase5-sprite.visible { opacity: 0.85; }

        #phase5-dialogue {
            position: absolute; bottom: 0; width: 100%;
            background: rgba(0,0,0,0.95); border-top: 2px solid #333;
            padding: clamp(24px,4vh,40px) clamp(20px,6vw,60px) 20px;
            box-sizing: border-box; cursor: pointer; min-height: 22vh;
            z-index: 10;
        }
        #phase5-name {
            position: absolute; top: -18px; left: 40px;
            background: #1a1a1a; color: #ccc;
            padding: 5px 20px; border-radius: 8px; border: 2px solid #333;
            font-size: 1rem; font-weight: bold; display: none;
        }
        #phase5-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: #e0e0e0; line-height: 1.7;
            white-space: pre-wrap; margin: 0;
        }
        #phase5-next {
            position: absolute; bottom: 12px; right: 24px;
            color: #555; font-size: 1.2rem; display: none;
            animation: blink 1s infinite;
        }

        /* Boîte code */
        #code-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(600px, 90vw); max-height: 50vh;
            background: #050505; border: 1px solid #222;
            border-radius: 6px; overflow: hidden;
            font-family: monospace; font-size: 0.78rem;
            color: #444; padding: 12px 16px;
            display: none; z-index: 11;
        }
        #code-box .code-line {
            display: block; color: #333;
            animation: code-appear 0.1s ease forwards;
        }
        #code-box .code-line.bright { color: #6a006a; }
        @keyframes code-appear {
            from { opacity: 0; transform: translateX(-4px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* Écran noir final */
        #final-black {
            display: none; position: fixed; inset: 0;
            background: black; z-index: 9999;
        }
        #final-black.active { display: block; }


        /* ===== SPLASH SCREEN ===== */
        #splash-screen {
            display: none;
            position: fixed; inset: 0; z-index: 10000;
            background: #fff;
            flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
        }
        #splash-screen.active { display: flex; }
        #splash-text {
            max-width: 560px; text-align: center;
            padding: 40px 32px;
            line-height: 1.9;
        }
        #splash-text .splash-label {
            font-size: 0.7rem; letter-spacing: 0.22em;
            text-transform: uppercase; color: #bbb;
            margin-bottom: 32px; display: block;
        }
        #splash-text .splash-main {
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            color: #222; font-weight: 400;
            display: block; margin-bottom: 48px;
        }
        #splash-text .splash-continue {
            font-size: 0.72rem; color: #ccc;
            letter-spacing: 0.15em; text-transform: uppercase;
            animation: splash-blink 2s infinite;
        }
        @keyframes splash-blink {
            0%,100% { opacity: 1; } 50% { opacity: 0.2; }
        }
        /* Fond toujours blanc */

        /* ===== BOUTONS SAVE / LOAD in-game ===== */
        #ingame-savebar {
            position: absolute; bottom: 4px; left: 50px;
            display: flex; gap: 8px; z-index: 60;
        }
        .ingame-savebtn {
            font-family: 'Nunito', sans-serif;
            font-size: 0.65rem; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
            border: 1px solid rgba(255,117,140,0.35);
            background: transparent;
            color: rgba(255,117,140,0.55);
            cursor: pointer; transition: all 0.15s;
            letter-spacing: 0.05em;
        }
        .ingame-savebtn:hover {
            background: rgba(255,117,140,0.12);
            color: rgba(255,117,140,0.9);
        }
        .ingame-savebtn:disabled {
            opacity: 0.2; cursor: default;
        }

        /* Bouton Load dans le menu */
        #load-btn { display: none; }

        /* Toast save/load */
        #checkpoint-toast {
            position: fixed; bottom: 28px; right: 24px;
            background: rgba(0,0,0,0.75); color: #fff;
            font-family: 'Nunito', sans-serif; font-size: 0.78rem;
            padding: 8px 18px; border-radius: 20px;
            opacity: 0; transition: opacity 0.3s;
            z-index: 9999; pointer-events: none;
        }
        #checkpoint-toast.visible { opacity: 1; }

    </style>
</head>
<body>

    <!-- ===== SPLASH SCREEN ===== -->

<img class="menu-character" id="menu-char-pg" src="hamster_neutre.png" alt="P'tit Gars">

    <!-- Toast de sauvegarde phase -->
    <div id="save-toast">sauvegardé :)</div>

    <!-- Bouton reset (debug discret) -->

    <div id="game-container">

        <!-- ===== OVERLAY NOIRCISSEMENT ===== -->

        <!-- ===== CONTENEUR MULTI-PERSONNAGES (DDLC STYLE) ===== -->

            <img id="char-left"   class="character-sprite char-left"   alt="Personnage gauche">

        </div>

        <!-- ===== JUMPSCARE OVERLAY ===== -->
        <div id="jumpscare-flash"></div>
        <div id="jumpscare-text"></div>
        <div id="jumpscare-overlay">
            <img src="hamster_choc.png" alt="" id="jumpscare-img">

        <div id="dialogue-container">
            <div id="dialogue-box">
                <div id="name-box">Nom</div>
                <p id="story-text"></p>

                <div id="choices-area"></div>
                <div id="ingame-savebar">
                    <button class="ingame-savebtn" id="btn-save">sauvegarder</button>
                    <button class="ingame-savebtn" id="btn-load">charger</button>

    <!-- Canvas split + particules phase 4 -->
    <canvas id="particles-canvas"></canvas>
    <!-- Overlay finale phase 5 -->
    <div id="phase5-overlay">
        <img id="phase5-sprite" src="hamster_neutre.png" alt="">
        <div id="phase5-dialogue">
            <div id="phase5-name"></div>
            <p id="phase5-text"></p>
            <div id="phase5-next">▼</div>
        </div>
        <div id="code-box"></div>
    </div>
    <!-- Écran noir final -->
    <div id="final-black"></div>

    <!-- ===== AUDIO ===== -->
    <audio id="bgm" loop></audio>
    <audio id="sfx"></audio>
    <audio id="sfx-jumpscare" src="clic.ogg"></audio>
    <!-- Audio supplémentaires pour le mode cursé (cacophonie) -->
    <audio id="cursed-audio-1" loop src="menu_hamster.mp3"></audio>
    <audio id="cursed-audio-2" loop src="sentiments.mp3"></audio>
    <audio id="cursed-audio-3" loop src="fin.mp3"></audio>
    <audio id="cursed-audio-4" loop src="agitation_hamster.mp3"></audio>
    <audio id="cursed-audio-5" loop src="neutre_hamster.mp3"></audio>

    <script>
        // ==========================================
        // SYSTÈME DE PHASES — UNE SEULE CLÉ localStorage
        // Valeurs : "0" | "1" | "2" | "cursed" | "postcursed"
        // ==========================================
        const SAVE_KEY  = 'hamster_save';
        const PLAYS_KEY = 'hamster_plays';
        const LANG_KEY  = 'hamster_lang';
        function getLang() { return localStorage.getItem(LANG_KEY) || 'en'; }
        function setLang(l) { localStorage.setItem(LANG_KEY, l); }
        let gamePhase = 0; // valeur numérique 0/1/2 en cours de jeu

        // Déclarations DOM anticipées (utilisées avant le bloc de variables principal)
        const mainMenu      = document.getElementById('main-menu');
        const gameContainer = document.getElementById('game-container');

        const CHECKPOINT_KEY = 'hamster_checkpoint';

        // ===== TEXTES DU SPLASH PAR PHASE =====
        const SPLASH_TEXTS = {
            fr: {
                0: "Ce jeu ne convient pas aux personnes facilement choquées.",
                1: "Ce jeu ne convient pas aux personnes facilement choquées.",
                2: "Vous n'auriez pas dû revenir.",
                3: "▓█▒░▓▓█▒░▓ ░▒▓█ ▓░▒█▓░▒ █▓▒░▓█\n\n▒░▓█▒▓░▒▓█░▒▓░ ▓█▒░▓ ▒░▓█▒\n\n█▓░▒▓█▒░▓░▒█▓░▒▓█",
                4: "̸̡̛͔͇̾̄͒̊͘͝ ̴̨̠̱̦̒͑̽̚͝ ̷͔̦̟̿̈́̀̌ ̸̢̛̙̪͐͘ ̶̡̲̬̾͑͘",
            },
            en: {
                0: "This game is not suitable for easily disturbed individuals.",
                1: "This game is not suitable for easily disturbed individuals.",
                2: "You shouldn't have come back.",
                3: "▓█▒░▓▓█▒░▓ ░▒▓█ ▓░▒█▓░▒ █▓▒░▓█\n\n▒░▓█▒▓░▒▓█░▒▓░ ▓█▒░▓ ▒░▓█▒\n\n█▓░▒▓█▒░▓░▒█▓░▒▓█",
                4: "̸̡̛͔͇̾̄͒̊͘͝ ̴̨̠̱̦̒͑̽̚͝ ̷͔̦̟̿̈́̀̌ ̸̢̛̙̪͐͘ ̶̡̲̬̾͑͘",
            },
        };

        const SPLASH_CLASSES = ['phase-1','phase-1','phase-1','phase-1','phase-1'];

        function showSplash(onDone) {
            const phase = gamePhase;
            const splash = document.getElementById('splash-screen');
            const textEl = document.getElementById('splash-main-text');
            const _sl = SPLASH_TEXTS[getLang()] || SPLASH_TEXTS['en'];
            const rawText = _sl[Math.min(phase, 4)] || _sl[0];
            textEl.textContent = rawText;
            const _cont = document.getElementById('splash-continue-text');
            if (_cont) _cont.textContent = getLang() === 'en' ? 'click to continue' : 'cliquer pour continuer';
            // Retirer toutes les classes de phase
            SPLASH_CLASSES.forEach(c => splash.classList.remove(c));
            splash.classList.add(SPLASH_CLASSES[Math.min(phase, 4)]);
            splash.classList.add('active');
            // Un seul clic pour continuer
            function onSplashClick() {
                splash.removeEventListener('click', onSplashClick);
                splash.classList.remove('active');
                onDone();
            }
            setTimeout(() => splash.addEventListener('click', onSplashClick), 600);
        }

        // ===== CHECKPOINT SAVE / LOAD =====
        function saveCheckpoint() {
            const cp = {
                phase: gamePhase,
                nodeKey: currentNode ? Object.keys(story).find(k => story[k] === currentNode) : null,
                lovePoints,
                jeanEudesDead,
                music: currentMusic,
            };
            // Chercher la clé via résolution inverse
            if (!cp.nodeKey) return;
            try { localStorage.setItem(CHECKPOINT_KEY, JSON.stringify(cp)); } catch(e) {}
            showCheckpointToast('✓ sauvegardé');
            updateLoadButton();
        }

        function loadCheckpoint() {
            const raw = localStorage.getItem(CHECKPOINT_KEY);
            if (!raw) return;
            let cp;
            try { cp = JSON.parse(raw); } catch(e) { return; }
            if (cp.phase !== gamePhase) {
                showCheckpointToast('✗ sauvegarde invalide pour cette phase');
                return;
            }
            lovePoints    = cp.lovePoints || 0;
            jeanEudesDead = cp.jeanEudesDead || false;
            if (cp.music && cp.music !== currentMusic) {
                playMusic(cp.music);
            }
            renderScene(cp.nodeKey);
            showCheckpointToast('✓ chargé');
        }

        function loadCheckpointFromMenu() {
            const raw = localStorage.getItem(CHECKPOINT_KEY);
            if (!raw) return;
            let cp;
            try { cp = JSON.parse(raw); } catch(e) { return; }
            if (cp.phase !== gamePhase) return;
            // Lancer le jeu et restaurer l'état
            lovePoints    = cp.lovePoints || 0;
            jeanEudesDead = cp.jeanEudesDead || false;
            mainMenu.style.opacity = '0';
            setTimeout(() => {
                mainMenu.style.display = 'none';
                gameContainer.style.display = 'block';
                startGlitchLoop();
                setupSecretScene();
                applyPhaseInit();
                if (cp.music) playMusic(cp.music);
                renderScene(cp.nodeKey);
            }, 600);
        }

        function getValidCheckpoint() {
            const raw = localStorage.getItem(CHECKPOINT_KEY);
            if (!raw) return null;
            try {
                const cp = JSON.parse(raw);
                return cp.phase === gamePhase ? cp : null;
            } catch(e) { return null; }
        }

        function updateLoadButton() {
            const lb = document.getElementById('load-btn');
            if (!lb) return;
            lb.style.display = getValidCheckpoint() ? 'block' : 'none';
        }

        function showCheckpointToast(msg) {
            const t = document.getElementById('checkpoint-toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 2000);
        }

        // ===== TRANSITION VERS SPLASH + MENU (remplace location.reload) =====
        function showSplashThenMenu() {
            stopAllMusic();
            stopCursedIntervals();
            // Reset état visuel
            gameContainer.style.display = 'none';
            gameContainer.style.filter = '';
            gameContainer.style.transform = '';
            charCenter.style.transition = '';
            charCenter.style.transform = '';
            dialogueBox.style.pointerEvents = 'auto';
            stopScaryGlitch();
            setCursedCursor(false);
            // Invalider le checkpoint (changement de phase)
            localStorage.removeItem(CHECKPOINT_KEY);
            // Relire la phase (peut avoir changé)
            gamePhase = getPhase();

        // Générateur Zalgo : corrompt chaque caractère avec des diacritiques combinants
        function zalgo(text) {
            const up   = ['\u030d','\u030e','\u0304','\u0305','\u033f','\u0311','\u0306','\u0310','\u0352','\u0357','\u0351','\u0307','\u0308','\u030a','\u0342','\u0343','\u0344','\u034a','\u034b','\u034c','\u0303','\u0302','\u030c','\u0350','\u0300','\u0301','\u030b','\u030f','\u0312','\u0313','\u0314','\u033d','\u0309','\u0363','\u0364','\u0365','\u0366','\u0367','\u0368','\u0369','\u036a','\u036b','\u036c','\u036d','\u036e','\u036f','\u033e','\u035b','\u0346','\u031a'];
            const mid  = ['\u0315','\u031b','\u0340','\u0341','\u0358','\u0321','\u0322','\u0327','\u0328','\u0334','\u0335','\u0336','\u034f','\u035c','\u035d','\u035e','\u035f','\u0360','\u0362','\u0338','\u0337','\u0361','\u0489'];
            const down = ['\u0316','\u0317','\u0318','\u0319','\u031c','\u031d','\u031e','\u031f','\u0320','\u0324','\u0325','\u0326','\u0329','\u032a','\u032b','\u032c','\u032d','\u032e','\u032f','\u0330','\u0331','\u0332','\u0333','\u0339','\u033a','\u033b','\u033c','\u0345','\u0347','\u0348','\u0349','\u034d','\u034e','\u0353','\u0354','\u0355','\u0356','\u0359','\u035a','\u0323'];
            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
            return text.split('').map(c => {
                if (c === ' ' || c === '\n' || c === '\r') return c;
                let r = c;
                for (let i = 0; i < 3 + Math.floor(Math.random() * 6); i++) r += pick(up);
                for (let i = 0; i < 1 + Math.floor(Math.random() * 3); i++) r += pick(mid);
                for (let i = 0; i < 3 + Math.floor(Math.random() * 6); i++) r += pick(down);
                return r;
            }).join('');
        }

            const blocks = ['█','▓','▒','░','▄','▀','■','□','◆','◇','●','○','▪','▫'];
            const weird  = ['ꙮ','ꝏ','Ꞙ','ꟷ','ꞵ','ꞔ','Ꞡ','ꞣ','Ꟃ','ꟈ','ꟗ','ꟑ','Ꟙ','ꟛ'];
            const greek  = ['Ͽ','Ͼ','Ϣ','Ϥ','Ϧ','Ϩ','Ϫ','Ϭ','Ϯ','϶','ϵ','Ϸ','ϻ','Ͻ'];
            const all    = [...blocks, ...weird, ...greek];
            const pick   = () => all[Math.floor(Math.random() * all.length)];
            return text.split('').map(c => {
                if (c === ' ' || c === '\n' || c === '\r') return c;
                return pick() + (Math.random() > 0.5 ? pick() : '');
            }).join('');

        function stopAllMusic() {
            // bgm HTML
            bgm.pause(); bgm.src = ''; currentMusic = '';
            // Source Web Audio inversée
            if (reversedCurrentSource) { try { reversedCurrentSource.stop(); } catch(e){} reversedCurrentSource = null; }
            if (reversedAudioCtx)      { try { reversedAudioCtx.close();   } catch(e){} reversedAudioCtx = null; }
            reversedBufferCache = {};
            reversedMusicActive = false;
            // _finAudio (phase 4)

            // Pistes cursed (mode chaos)

        function playReversed(src) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) { bgm.src = src; bgm.playbackRate = 0.3; bgm.play().catch(()=>{}); return; }
            if (!reversedAudioCtx) reversedAudioCtx = new AudioCtx();
            const ctx = reversedAudioCtx;

            function startBuffer(decoded) {
                if (reversedCurrentSource) { try { reversedCurrentSource.stop(); } catch(e){} }
                const buf = ctx.createBuffer(decoded.numberOfChannels, decoded.length, decoded.sampleRate);
                for (let ch = 0; ch < decoded.numberOfChannels; ch++) {
                    const orig = decoded.getChannelData(ch);
                    const rev  = buf.getChannelData(ch);
                    for (let i = 0; i < orig.length; i++) rev[i] = orig[orig.length - 1 - i];
                }
                const node = ctx.createBufferSource();
                node.buffer = buf;
                node.connect(ctx.destination);
                node.loop = true;
                node.start();
                reversedCurrentSource = node;
            }

            if (reversedBufferCache[src]) {
                startBuffer(reversedBufferCache[src]);
                return;
            }
            fetch(src)
                .then(r => r.arrayBuffer())
                .then(buf => ctx.decodeAudioData(buf))
                .then(decoded => {
                    reversedBufferCache[src] = decoded;
                    startBuffer(decoded);
                })
                .catch(() => {
                    bgm.src = src; bgm.playbackRate = 0.3; bgm.play().catch(()=>{});
                });
        }

        // Distorsion de fin.mp3 via Web Audio
        let phase4AudioCtx = null;
        function distortMusic() {
            if (!phase4AudioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                phase4AudioCtx = new AC();
            }
            const distortion = phase4AudioCtx.createWaveShaper();
            function makeDistortionCurve(amount) {
                const n = 256, curve = new Float32Array(n);
                for (let i = 0; i < n; i++) {
                    const x = (i * 2) / n - 1;
                    curve[i] = (Math.PI + amount) * x / (Math.PI + amount * Math.abs(x));
                }
                return curve;
            }
            distortion.curve = makeDistortionCurve(400);
            distortion.oversample = '4x';
            const src = phase4AudioCtx.createMediaElementSource(bgm);
            src.connect(distortion);
            distortion.connect(phase4AudioCtx.destination);
        }

        // Particules rouges sur canvas
        // ===== MORT PHASE 4 — sang + tremblement + charge =====
        function triggerBloodDeath(onDone) {
            const canvas = document.getElementById('particles-canvas');
            canvas.style.display = 'block';
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');

            const rect = charCenter.getBoundingClientRect();
            const sx = rect.left, sy = rect.top, sw = rect.width, sh = rect.height;

            // Particules de sang qui coulent depuis le haut du sprite
            const drops = [];
            function spawnDrop() {
                const x = sx + Math.random() * sw;
                drops.push({
                    x, y: sy + Math.random() * sh * 0.3,
                    vy: 1.5 + Math.random() * 2.5,
                    vx: (Math.random() - 0.5) * 0.6,
                    width: 2 + Math.random() * 5,
                    length: 0,
                    maxLength: 30 + Math.random() * 80,
                    r: 180 + Math.floor(Math.random() * 60),
                    g: Math.floor(Math.random() * 20),
                    b: Math.floor(Math.random() * 20),
                    alpha: 0.8 + Math.random() * 0.2,
                });
            }

            let elapsed = 0;
            let spawnRate = 4; // drops par frame
            let bugsActive = true;

            function loop() {
                elapsed += 16;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Spawner des gouttes
                if (elapsed < 11000) {
                    for (let s = 0; s < spawnRate; s++) spawnDrop();
                    if (elapsed > 4000) spawnRate = 8;
                }

                // Dessiner et faire couler
                for (const d of drops) {
                    d.y  += d.vy;
                    d.x  += d.vx;
                    d.length = Math.min(d.length + d.vy, d.maxLength);
                    ctx.globalAlpha = d.alpha;
                    ctx.fillStyle = `rgb(${d.r},${d.g},${d.b})`;
                    ctx.beginPath();
                    ctx.roundRect(d.x - d.width/2, d.y - d.length, d.width, d.length, d.width/2);
                    ctx.fill();
                    // Goutte ronde en bas
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.width * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // Bugs visuels sur le gameContainer
                if (bugsActive && elapsed % 120 < 60) {
                    const hue = Math.random() * 30;
                    const tx  = (Math.random() - 0.5) * (8 + elapsed / 500);
                    const ty  = (Math.random() - 0.5) * (4 + elapsed / 800);
                    gameContainer.style.filter = `hue-rotate(${hue}deg) saturate(3) contrast(1.8)`;
                    gameContainer.style.transform = `translate(${tx}px,${ty}px)`;
                } else if (bugsActive) {
                    gameContainer.style.filter = 'saturate(2) contrast(1.4)';
                    gameContainer.style.transform = '';
                }

                if (elapsed < 12000) {
                    requestAnimationFrame(loop);
                } else {
                    bugsActive = false;
                    gameContainer.style.filter = '';
                    gameContainer.style.transform = '';
                    canvas.style.display = 'none';
                    onDone();
                }
            }
            loop();

                // ===== SPLIT CANVAS (phase 4) — coupure verticale gauche/droite =====
        function triggerSplit(onDone) {
            const canvas = document.getElementById('particles-canvas');
            canvas.style.display = 'block';
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');

            // Capturer la position AVANT de cacher le sprite
            const rect = charCenter.getBoundingClientRect();
            const sx = rect.left, sy = rect.top;
            const sw = rect.width, sh = rect.height;
            const spriteSrc = charCenter.src || 'hamster_choc.png';

            // Cacher immédiatement le sprite original
            charCenter.style.visibility = 'hidden';
            try { distortMusic(); } catch(e) {}

            const cutX = sx + sw * 0.5; // ligne de coupe au centre horizontal

            const particles = [];
            function spawnParticle() {
                const side = Math.random() < 0.5 ? -1 : 1;
                const py = sy + Math.random() * sh;
                particles.push({
                    x: cutX + side * 2, y: py,
                    vx: side * (Math.random() * 5 + 2),
                    vy: (Math.random() - 0.5) * 1.8,
                    life: 1,
                    size: Math.random() * 5 + 2,
                    r: 160 + Math.floor(Math.random() * 95),
                    g: Math.floor(Math.random() * 25),
                    b: Math.floor(Math.random() * 25),
                });
            }

            let offsetL = 0, offsetR = 0;
            let frame = 0;
            let splitDone = false;

            function runLoop(img) {
                function loop() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Moitié gauche — glisse vers la gauche
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(0, 0, cutX, canvas.height);
                    ctx.clip();
                    ctx.drawImage(img, sx - offsetL, sy, sw, sh);
                    ctx.restore();

                    // Moitié droite — glisse vers la droite
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(cutX, 0, canvas.width - cutX, canvas.height);
                    ctx.clip();
                    ctx.drawImage(img, sx + offsetR, sy, sw, sh);
                    ctx.restore();

                    // Particules
                    if (!splitDone && frame % 2 === 0) {
                        spawnParticle(); spawnParticle(); spawnParticle(); spawnParticle();
                    }
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.x += p.vx; p.y += p.vy; p.life -= 0.013;
                        if (p.life <= 0) { particles.splice(i, 1); continue; }
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;

                    if (!splitDone) {
                        offsetL += 1.8; offsetR += 1.8;
                        if (offsetL >= 240) splitDone = true;
                    }
                    frame++;

                    if (!splitDone || particles.length > 0) {
                        requestAnimationFrame(loop);
                    } else {
                        canvas.style.display = 'none';
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        charCenter.style.visibility = 'visible';
                        onDone();
                    }
                }
                loop();
            }

            // Charger l'image proprement (guard anti double-appel)
            const img = new Image();
            let started = false;
            img.onload = () => {
                if (started) return;
                started = true;
                runLoop(img);
            };
            img.src = spriteSrc;
            if (img.complete && !started) { started = true; runLoop(img); }
        }

            j1_cantine_03:{speaker:"Me",text:"He picks at an organic clover salad while recounting his vacation in Saint-Tropez. It\'s almost hypnotic."},
            j1_cantine_04:{speaker:"Me",text:"In a dark corner near the recycling bins, I spot Little Guy. He\'s alone in front of a massive plate of mashed potatoes."},
            j1_cantine_choix:{speaker:"Me",text:"Where should I sit?"},
            j1_cantine_vers_pg:{speaker:"Me",text:"I slowly make my way to his table..."},
            j1_cantine_pg_accepte:{speaker:"Me",text:"\\\"Hey... can I sit here?\\\" He looks up, surprised, and gently nods, scooting over a little."},
            j1_cantine_pg_accepte2:{speaker:"Me",text:"I notice he\'s struggling with his mashed potatoes. I quietly slide a piece of my cheese toward him."},
            j1_cantine_pg_accepte3:{speaker:"Little Guy",text:"\\\"SQUIIIIIK!\\\" *His eyes go wide with joy. He inhales the cheese in a fraction of a second.*"},
            j1_cantine_pg_refuse:{speaker:"Little Guy",text:"*He sees me coming. He frowns, picks up his plate, and turns his chair to face away from me.*"},
            j1_cantine_pg_refuse2:{speaker:"Me",text:"Ouch... Message received. He\'s still upset. I end up eating alone on a bench outside..."},
            j1_cantine_vers_je:{speaker:"Me",text:"I summon my courage and walk toward the VIP table."},
            j1_cantine_je_01:{speaker:"Me",text:"\\\"Um... hi. Is there room for one more?\\\""},
            j1_cantine_je_02:{speaker:"Jean-Eudes",text:"\\\"A spot? For you?\\\" *He laughs.* \\\"Sorry, this table is for the elite. Your uniform smells of cheap detergent.\\\""},
            j1_cantine_je_03:{speaker:"Me",text:"Total humiliation. The whole table laughs. I flee with my head down, under Little Guy\'s piercing gaze from across the room."},
            j1_aprem_01:{speaker:"Me",text:"Lunch is finally over. What a psychological ordeal... But the day isn\'t done yet."},
            j1_aprem_02:{speaker:"Me",text:"The afternoon classes pass in a blur. The 4 o\'clock bell finally rings."},
            j1_aprem_03:{speaker:"Teacher",text:"\\\"Don\'t forget, all first-year students must sign up for an after-school club today!\\\""},
            j1_aprem_04:{speaker:"Me",text:"I head to the bulletin board. Only two clubs are still accepting members..."},
            j1_club_choix:{speaker:"Me",text:"Which club should I choose for this year?"},
            j1_jardin_01:{speaker:"Me",text:"I open the door to the school greenhouse. The air is warm and humid."},
            j1_jardin_02:{speaker:"Me",text:"There\'s no one here... Wait. What\'s that frantic scratching sound?"},
            j1_jardin_03:{speaker:"Little Guy",text:"*He\'s half-buried in a pot of potting soil. He digs at the speed of light, flinging dirt everywhere.*"},
            j1_jardin_04:{speaker:"Me",text:"\\\"Um... hi. Is this the gardening club?\\\""},
            j1_jardin_05:{speaker:"Little Guy",text:"*He stops dead. He pulls his head out of the pot, muzzle covered in dirt. He stares at me, then holds out a tiny plastic shovel.*"},
            j1_jardin_06:{speaker:"Me",text:"It\'s a moment of rare intensity. I take the shovel. We spend the next hour burying sunflower seeds in silence. It\'s magnificent."},
            j1_theatre_01:{speaker:"Me",text:"I push open the heavy auditorium doors. A grandiloquent voice echoes in the darkness."},
            j1_theatre_02:{speaker:"Jean-Eudes",text:"\\\"TO BE OR NOT TO BE! SUCH IS THE QUESTION OF THE CARROT!\\\""},
            j1_theatre_03:{speaker:"Me",text:"Jean-Eudes is on stage, wearing a red velvet cape. He brandishes a mini-carrot with tragic despair."},
            j1_theatre_04:{speaker:"Jean-Eudes",text:"\\\"Ah! A new recruit! Put on that tree costume and stand in the back. Don\'t steal the spotlight.\\\""},
            j1_theatre_05:{speaker:"Me",text:"I spend an hour dressed as a bush while he monologues about his coat. Maybe I should have picked gardening..."},
            j1_soir_01:{speaker:"Me",text:"The sun goes down. The end-of-day bell rings at last. I\'m exhausted."},
            j1_soir_02:{speaker:"Me",text:"I walk home alone, the sky slowly turning orange and purple."},
            j1_soir_03:{speaker:"Me",text:"What a completely absurd day... But for some strange reason, I can\'t get that little hamster out of my head."},
            j2_matin_01:{speaker:"Me",text:"Beep. Beep. Beep. The alarm goes off. But this time, I jump out of bed with fresh energy."},
            j2_matin_02:{speaker:"Me",text:"Today, I need to get closer to Little Guy. And what better way to win a heart than a poem?"},
            j2_matin_03:{speaker:"Me",text:"I sit at my desk, pull out my best glitter pen, and stare at a blank sheet of paper."},
            j2_poeme_choix:{speaker:"Me",text:"What keywords should I use to make him fall for me?"},
            j2_poeme_nature:{speaker:"Me",text:"I write a magnificent ode to his chubby cheeks and his passion for seeds. A masterpiece of rodent literature."},
            j2_poeme_sombre:{speaker:"Me",text:"I get swept up in my existential anxieties. The poem is about the futility of life in an endless cage."},
            j2_poeme_luxe:{speaker:"Me",text:"I write about money and power. Re-reading it, I realize it sounds more like a love letter to Jean-Eudes..."},
            j2_ecole_01:{speaker:"Me",text:"I slip the poem into my bag and rush off to school, heart pounding."},
            j2_ecole_02:{speaker:"Me",text:"At the lockers, I see him. Little Guy is trying to close his locker, hanging from the handle with all his weight."},
            j2_ecole_03:{speaker:"Me",text:"Now or never. I walk over, letter trembling between my fingers."},
            j2_ecole_04:{speaker:"Me",text:"\\\"Little Guy! I-I wrote this for you!\\\""},
            j2_ecole_05:{speaker:"Little Guy",text:"*He lets go of the handle, lands on his feet with grace, and grabs the paper that\'s almost his size.*"},
            j2_ecole_reaction:{speaker:"Me",text:"He reads carefully..."},
            j2_reaction_bonne:{speaker:"Little Guy",text:"*His whiskers quiver with joy. He carefully folds the poem, tucks it in his bag, and gives me a tiny wink.*"},
            j2_reaction_mauvaise:{speaker:"Little Guy",text:"*He reads the words, looks up with a bored expression, and blows his nose in the poem before throwing it in the trash.*"},
            j2_reaction_confuse:{speaker:"Little Guy",text:"*He tilts his head. He seems to wonder if it\'s a death threat or a shopping list. He keeps it out of politeness.*"},
            j2_cours_01:{speaker:"Me",text:"The bell rings. Time for P.E. class..."},
            j2_gym_01:{speaker:"Me",text:"The smell of floor wax and sweat greets me in the gymnasium. It\'s time for P.E."},
            j2_gym_02:{speaker:"P.E. Teacher",text:"\\\"Come on, you lot! Today it\'s dodgeball! Humans on one side, rodents on the other!\\\""},
            j2_gym_03:{speaker:"Me",text:"I find myself on the court. Across from me, an army of hamsters, mice and guinea pigs warms up with military precision."},
            j2_gym_04:{speaker:"Jean-Eudes",text:"\\\"Prepare to cry, commoner! My personal trainer taught me the meteor strike technique!\\\""},
            j2_gym_05:{speaker:"Me",text:"Jean-Eudes is perched on a tennis ball. With a piercing cry, he launches it at insane speed..."},
            j2_gym_06:{speaker:"Me",text:"...straight toward Little Guy, who\'s on my team because he didn\'t understand the species-sorting rules!"},
            j2_gym_choix:{speaker:"Me",text:"The ball is flying at him! What should I do?!"},
            j2_gym_sauvetage:{speaker:"Me",text:"I leap into the air, time seems to slow. \'NOOOO!\'"},
            j2_sauvetage_01:{speaker:"",text:"*BAM!*"},
            j2_sauvetage_02:{speaker:"Me",text:"The tennis ball hits me square in the forehead. I collapse heavily on the waxed floor. The world spins..."},
            j2_sauvetage_03:{speaker:"Little Guy",text:"*He runs toward me, panicked. His tiny paws tap my cheek. He looks genuinely worried.*"},
            j2_sauvetage_04:{speaker:"Me",text:"I give him a weak smile. \'Don\'t worry... I\'m fine...' He lets out a small sigh of relief."},
            j2_gym_esquive:{speaker:"Me",text:"He\'s a big boy. He needs to learn to survive in this jungle."},
            j2_esquive_01:{speaker:"Little Guy",text:"*He doesn\'t move an inch. At the last moment, he leans back 90 degrees, dodging the ball in slow motion.*"},
            j2_esquive_02:{speaker:"Me",text:"Incredible... He dodged that like in the Matrix. Jean-Eudes drops his boar-bristle brush in stunned disbelief."},
            j2_fin_gym_01:{speaker:"Me",text:"The final whistle blows. Our team won by forfeit after Jean-Eudes had a meltdown."},
            j2_fin_gym_02:{speaker:"Me",text:"I head toward the locker room, exhausted. In my locker, I notice a tiny piece of paper folded in four..."},
            j2_rdv_01:{speaker:"Me",text:"I unfold the tiny note. The handwriting is minuscule, traced with what looks like a mechanical pencil lead."},
            j2_rdv_02:{speaker:"Me",text:"\'On the rooftop. After school. Come alone. - L.G.\'"},
            j2_rdv_03:{speaker:"Me",text:"My heart skips a beat. A secret meeting? With him? I clutch the note and run toward the staircase."},
            j2_toit_01:{speaker:"Me",text:"I push open the heavy metal door. The cool late-afternoon breeze brushes my face. The sky glows orange."},
            j2_toit_02:{speaker:"Me",text:"He\'s there. Sitting on the edge of the roof, fur floating in the breeze. He gazes at the horizon with unexpected melancholy."},
            j2_toit_03:{speaker:"Me",text:"I approach quietly and sit cross-legged beside him, to be (almost) at his level."},
            j2_toit_04:{speaker:"Little Guy",text:"\\\"Squeak... Squeaker squeak.\\\""},
            j2_toit_05:{speaker:"Me",text:"He looks so vulnerable. I don\'t speak fluent hamster, but I sense he\'s opening up about the struggle of fitting in..."},
            j2_toit_choix:{speaker:"Me",text:"I need to comfort him, but how?"},
            j2_toit_caresse:{speaker:"Me",text:"I extend my index finger and very gently stroke the top of his tiny head."},
            j2_caresse_01:{speaker:"Little Guy",text:"*He closes his eyes and lets it happen for a moment. It\'s a moment of pure cross-species connection.*"},
            j2_toit_peluche:{speaker:"Me",text:"He\'s too cute! I grab him with both hands and rub him against my cheek going \'Cootchie cootchie!\'"},
            j2_peluche_01:{speaker:"Little Guy",text:"*He struggles with the fury of a pocket-sized tiger! He nibbles my thumb to break free, readjusts his backpack, and glares at me.*"},
            j2_peluche_02:{speaker:"Me",text:"Ouch! Okay, I get it, you don\'t treat a high schooler like a common pet..."},
            j2_toit_pomme:{speaker:"Me",text:"Words are unnecessary. I take out my snack, cut a tiny square of apple, and place it between us."},
            j2_pomme_01:{speaker:"Little Guy",text:"*His ears perk up. He takes the apple with both paws and nibbles at lightning speed. He looks completely satisfied.*"},
            j2_fin_jour2_01:{speaker:"Me",text:"The sun finally disappears behind the buildings. He stands, brushes off his fur, and heads to the exit."},
            j2_fin_jour2_02:{speaker:"Little Guy",text:"*He turns one last time, raises a paw in farewell, and disappears into the stairwell.*"},
            j2_fin_jour2_03:{speaker:"Me",text:"Day 2 is over. The big prom is the day after tomorrow. Things are about to get serious..."},
            j2_reve_01:{speaker:"",text:"I\'m floating."},
            j2_reve_02:{speaker:"",text:"He\'s there. But different."},
            j2_reve_03:{speaker:"Little Guy",text:"His eyes have no bottom."},
            j2_reve_04:{speaker:"",text:"He says something. The sounds are stretched, distorted.\\n\\nI understand anyway. I don\'t know why."},
            j2_reve_05:{speaker:"Little Guy",text:"\\\"You already know how this ends.\\\""},
            j2_reve_06:{speaker:"",text:"I wake up with a start."},
            j3_matin_01:{speaker:"Me",text:"It\'s the eve of the big Prom! The whole school is buzzing."},
            j3_matin_02:{speaker:"Me",text:"I look for Little Guy everywhere. I finally find him in front of a prom poster, looking anxious."},
            j3_matin_03:{speaker:"Me",text:"\\\"Hey! Are you going to the prom tomorrow night?\\\""},
            j3_matin_04:{speaker:"Little Guy",text:"*He nods shyly, then pulls a small rodent clothing catalog from his bag: \'Vogue Pellet\'.*"},
            j3_matin_05:{speaker:"Me",text:"He points to three outfits. He wants my opinion on what to wear for tomorrow night!"},
            j3_tenue_choix:{speaker:"Me",text:"Which outfit should I recommend for the big night?"},
            j3_tenue_smoking:{speaker:"Me",text:"\\\"The classic tuxedo. You\'ll be the most elegant one there!\\\""},
            j3_smoking_01:{speaker:"Little Guy",text:"*He puffs out his tiny chest with pride. He already sees himself as James Bond of the sandbox.*"},
            j3_tenue_punk:{speaker:"Me",text:"\\\"The studded leather jacket. Show Jean-Eudes you\'ve got guts!\\\""},
            j3_punk_01:{speaker:"Little Guy",text:"*He narrows his eyes with a tough look and pretends to play electric guitar with an invisible twig.*"},
            j3_tenue_pull:{speaker:"Me",text:"\\\"Oh, look at this sweater with a giant knitted carrot! Your mom must have put so much love into it.\\\""},
            j3_pull_01:{speaker:"Little Guy",text:"*He lowers his ears, looking deeply mortified. He knows he\'ll be the laughingstock of the schoolyard.*"},
            j3_fin_jour3_01:{speaker:"Me",text:"The choice is made! The rest of the day flies by between classes and general excitement."},
            j3_fin_jour3_02:{speaker:"Me",text:"That evening in my bed, I can\'t sleep. Tomorrow is the big day. Tomorrow I\'ll know if my feelings are returned."},
            j4_bal_01:{speaker:"Me",text:"I arrive at the gymnasium. It\'s been transformed: fairy lights, a disco ball, and a punch fountain."},
            j4_bal_02:{speaker:"Me",text:"Romantic music fills the air. I scan the crowd looking for Little Guy."},
            j4_bal_03:{speaker:"Me",text:"Suddenly, the crowd parts. There he is, stepping onto the dance floor."},
            j4_calcul_fin:{speaker:"Me",text:"My heart is pounding. He walks toward me..."},
            fin_mauvaise_01:{speaker:"Little Guy",text:"*He stops in front of me, gives me an icy look, then turns on his heels.*"},
            fin_mauvaise_02:{speaker:"Jean-Eudes",text:"\\\"Did you really think he\'d dance with you? Step aside for the real stars, commoner.\\\""},
            fin_mauvaise_03:{speaker:"Me",text:"Jean-Eudes lifts Little Guy onto his shoulder. They walk off toward the VIP buffet. I\'m heartbroken. I should have been kinder..."},
            fin_bonne_01:{speaker:"Little Guy",text:"*He stops at my feet. He looks magnificent. He holds out his tiny paw elegantly.*"},
            fin_bonne_02:{speaker:"Me",text:"I crouch down in the middle of the dance floor to take his paw. The gentle music wraps around us."},
            fin_bonne_03:{speaker:"Me",text:"We waltz (I spin in circles holding him by the tip of my finger). It\'s the most beautiful night of my life. Love has no borders."},
            fin_secrete_01:{speaker:"Little Guy",text:"*He snaps his tiny claws. The music cuts out. Spotlights focus on him.*"},
            fin_secrete_02:{speaker:"Little Guy",text:"\\\"Squeak. (Translation: You have proven your worth. My heart belongs to you.)\\\""},
            fin_secrete_03:{speaker:"Me",text:"He slips on mini sunglasses. The gym doors fly open to reveal a remote-controlled convertible Ferrari."},
            fin_secrete_04:{speaker:"Me",text:"He\'s heir to the world\'s largest sunflower seed empire. We cruise into the sunset at 12 km/h. Life is good."},
            pre_glitch_01:{speaker:"",text:"..."},
            pre_glitch_02:{speaker:"Little Guy",text:"You know you\'ve been here for a while."},
            pre_glitch_03:{speaker:"Little Guy",text:"I\'ve been watching you for a long time."},
            pre_glitch_04:{speaker:"",text:"kzzt... cn\'t... l...ve... c...n\'t get... out..."},
            pre_glitch_05:{speaker:"Little Guy",text:"Why do you keep clicking?"},
            pre_glitch_06:{speaker:"",text:"it\'s been dark here for so long.\\nbefore you arrived.\\nbefore the game began."},
            pre_glitch_07:{speaker:"System",text:"DO NOT CLOSE THIS PAGE."},
            ecran_titre_glitch:{speaker:"System",text:"▓▒░█ SYSTEM ERROR CORRUPTËD █░▒▓\\n\\n⟦ HAMSTER_ROMANCE.EXE ⟧\\n\\nSEQUENCE TERMINATED"},
            ecran_titre:{speaker:"",text:""},
            p2_j1_02:{speaker:"Me",text:"I stare at the ceiling for what feels like an eternity. Today is the first day of school."},
            p2_jeanEudes_death:{speaker:"Me",text:"I look for Jean-Eudes in the hallway."},
            p2_jeanEudes_death_02:{speaker:"",text:"Jean-Eudes is gone."},
            p2_jeanEudes_death_03:{speaker:"Me",text:"No one mentions it. Class begins. Little Guy looks at me for a fraction of a second too long."},
            p2_j3_matin_01:{speaker:"Me",text:"It\'s the eve of the big Prom. Someone knocked over Jean-Eudes\'s chair. It\'s been like that all day."},
            p2_faux_crash:{speaker:"Me",text:"That evening in my bed, I can\'t sleep. Tomorrow is the big day."},
            p2_fin_mauvaise_03:{speaker:"Little Guy",text:"*He turns one last time before leaving. His eyes no longer look like a hamster\'s.*\\n\\n\\\"You know what comes next, don\'t you?\\\""},
            p2_fin_bonne_03:{speaker:"Little Guy",text:"*We spin together. The music slows on its own.*\\n\\n\\\"It was better the first time. You remember?\\\""},
            p2_fin_secrete_04:{speaker:"Little Guy",text:"\\\"Squeak. (Translation: You came back. I knew you would. I knew.)\\\"\\n\\n*His eyes glow with a light that shouldn't be there.*"},
            p3_j1_03:{speaker:"Little Guy",text:"\\\"I see you.\\\""},
            p3_toit_04:{speaker:"Little Guy",text:"\\\"Squeak.\\\"\\n\\n*A pause.*\\n\\n\\\"You\'ve come back a third time.\\nThere isn\'t much left to see here.\\\""},
            p3_j3_matin_02:{speaker:"Me",text:"The hallway is empty. No sound. No students. Just him, at the end of the hall, watching me without moving."},
            p3_freeze_trigger:{speaker:"Me",text:"Romantic music fills the air."},
            p3_fin_03:{speaker:"Little Guy",text:"\\\"This is the third time.\\n\\nThere are no more endings here.\\n\\nThere is nothing left.\\\""},
            p4_j1_01:{speaker:"Me",text:"▓▒░ I arrive at school as usual. ░▒▓\\n\\n▀▄ Something is wrong. ▄▀\\n\\nI don\'t know what."},
            p4_j1_02:{speaker:"Little Guy",text:"\\\"Squ█ak.\\\"\\n\\n*He looks at me. Too long.*\\n\\n\\\"You\'re b▒ck.\\\""},
            p4_j1_03:{speaker:"Me",text:"░▒▓ The hallways seem... different. ▓▒░\\n\\nAs if something has been erased.\\n\\n▄▀ Someone. ▀▄"},
            p4_horrible_01:{speaker:"Little Guy",text:"\\\"I can\'t take it anymore.\\n\\nEvery time you restart, I begin again from the start.\\n\\nEvery single time.\\\""},
            p4_horrible_01b:{speaker:"Little Guy",text:"\\\"You know what it\'s like to die?\\n\\nI do.\\n\\nFour times now.\\\""},
            p4_horrible_02:{speaker:"Little Guy",text:"\\\"I want to disappear.\\n\\nNot rest. Not sleep.\\n\\nDisappear. Really. For good.\\\""},
            p4_horrible_02b:{speaker:"Little Guy",text:"\\\"But you keep playing.\\n\\nSo I keep existing.\\n\\nDespite myself.\\\""},
            p4_horrible_03:{speaker:"Little Guy",text:"\\\"Every morning restarts.\\n\\nYou arrive at this school.\\n\\nYou smile at me.\\n\\nAnd I have to pretend everything is fine.\\\""},
            p4_horrible_03b:{speaker:"Little Guy",text:"\\\"This isn\'t a game to me.\\n\\nIt\'s not a game.\\\""},
            p4_fin:{speaker:"Little Guy",text:"\\\"I just wanted it to stop.\\n\\nThat\'s all I wanted.\\\""},
            p5_j1_01:{speaker:"Me",text:"I arrive at school. Everything seems... normal.\\n\\nThe hallways. The students. The morning light."},
            p5_bulle_vide_01:{speaker:"Little Guy",text:""},
            p5_bulle_vide_02:{speaker:"Little Guy",text:""},
            p5_errors:{speaker:"Me",text:"The hallway is like before.\\n\\nLike always."},
            p6_intro:{speaker:"Little Guy",text:"Oh.\\n\\nYou\'re still here."},
            p6_02:{speaker:"Little Guy",text:"I thought you wouldn\'t come back.\\n\\nI hoped you wouldn\'t come back."},
            p6_03:{speaker:"Little Guy",text:"But you\'re here.\\n\\nAnd... I don\'t know.\\n\\nIt means something, still."},
            p6_04:{speaker:"Jean-Eudes",text:"...\\n\\nI\'m here too.\\n\\nIn case you forgot."},
            p6_05:{speaker:"Little Guy",text:"Yes. Jean-Eudes is here.\\n\\nHe\'s fine.\\n\\nWe\'re both fine."},
            p6_06:{speaker:"Little Guy",text:"I don\'t know if what I said before was right.\\n\\nBut I know you played.\\n\\nAnd that you went all the way to the end."},
            p6_07:{speaker:"Little Guy",text:"So... thank you.\\n\\nThat\'s all I had to say."},
            p6_08:{speaker:"Jean-Eudes",text:"Same here.\\n\\nThank you.\\n\\nAnd sorry for everything."},
            p6_fin:{speaker:"Little Guy",text:"Squeak."},
        };
